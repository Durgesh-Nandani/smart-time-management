
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Time Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #F5F1FA;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .login-box {
            background: #FFFFFF;
            padding: 35px;
            width: 100%;
            max-width: 400px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(48, 32, 95, 0.10);
        }

        h2 {
            text-align: center;
            color: #30205F;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #756A91;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #E0D2F4;
            border-radius: 10px;
            font-size: 15px;
            background: #FCFAFF;
            outline: none;
        }

        input:focus {
            border-color: #7041BD;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            background: #7041BD;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5E32A5;
        }

        .forgot {
            display: block;
            text-align: right;
            margin: 8px 0;
            color: #7041BD;
            text-decoration: none;
            font-size: 14px;
        }

        .bottom-text {
            text-align: center;
            margin-top: 22px;
            color: #756A91;
        }

        a {
            color: #7041BD;
            font-weight: 600;
        }

        #message {
            text-align: center;
            margin-top: 12px;
        }
        .password-box {
    position: relative;
    width: 100%;
}

.password-box input {
    padding-right: 50px;
}

.password-box .eye-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 38px;
    height: 38px;
    margin: 0;
    padding: 8px;
    background: transparent;
    color: #000000;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.password-box .eye-btn:hover {
    background: #F5F1FA;
}
    </style>
</head>

<body>
    <div class="login-box">
        <h2>Welcome Back!</h2>
        <p class="subtitle">Login to manage your time smartly.</p>

        <form id="loginForm">
            <input type="email" id="email"
                   placeholder="Email address" required>

            <div class="password-box">
    <input type="password" id="password"
           placeholder="Password" required>

    <button type="button" id="togglePassword" class="eye-btn"
            aria-label="Show password">
        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg"
             width="22" height="22" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
            <circle cx="12" cy="12" r="3"/>
        </svg>
    </button>
</div>
            <a class="forgot" href="#" id="forgotPassword">
                Forgot Password?
            </a>

            <button type="submit">Login</button>
        </form>

        <p id="message"></p>

        <p class="bottom-text">
            Don't have an account?
            <a href="signup.html">Sign Up</a>
        </p>
    </div>

    <script>
        document.getElementById("togglePassword").addEventListener("click", function() {
    const password = document.getElementById("password");
    const eyeIcon = document.getElementById("eyeIcon");

    if (password.type === "password") {
        password.type = "text";
        this.setAttribute("aria-label", "Hide password");

        eyeIcon.innerHTML = `
            <path d="M3 3l18 18"/>
            <path d="M10.6 10.6a2 2 0 002.8 2.8"/>
            <path d="M9.9 5.2A10.5 10.5 0 0112 5c6.5 0 10 7 10 7a15 15 0 01-3 3.8"/>
            <path d="M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7a10 10 0 004-.8"/>
        `;
    } else {
        password.type = "password";
        this.setAttribute("aria-label", "Show password");

        eyeIcon.innerHTML = `
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
            <circle cx="12" cy="12" r="3"/>
        `;
    }
});
        document.getElementById("loginForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const message = document.getElementById("message");
            const email = document.getElementById("email").value.trim().toLowerCase();
            const password = document.getElementById("password").value;

            try {
                const response = await fetch("/api/auth/login", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const result = await response.json();

                if (response.ok) {

                    // Logged-in account ka email save karo
                    localStorage.setItem(
                        "smartTimeAccountEmail",
                        email
                    );

                    message.style.color = "green";
                    message.textContent = "Login successful!";

                    window.location.href = "/tasks.html";

                } else {
                    message.style.color = "red";
                    message.textContent = result.message || "Login failed.";
                }

            } catch (error) {
                message.style.color = "red";
                message.textContent = "Server connection failed.";
                console.error(error);
            }
        });

        document.getElementById("forgotPassword").addEventListener("click", function(event) {
            event.preventDefault();
            alert("Password reset feature will be available soon.");
        });
    </script>
</body>
</html>
